name: chatbot_app
description: Cross-platform chat APP with chatbots
publish_to: "none"
version: 0.1.0+1

environment:
  sdk: ">=3.5.0 <4.0.0"
  flutter: ">=3.24.0"

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter

  # State management
  flutter_riverpod: ^2.6.1
  riverpod_annotation: ^2.6.1

  # Navigation
  go_router: ^14.6.1

  # Network
  dio: ^5.7.0
  retrofit: ^4.4.1

  # Realtime
  socket_io_client: ^3.0.2

  # Local storage
  drift: ^2.21.0
  sqlite3_flutter_libs: ^0.5.27
  path_provider: ^2.1.5
  flutter_secure_storage: ^9.2.2
  shared_preferences: ^2.3.3

  # Models
  freezed_annotation: ^2.4.4
  json_annotation: ^4.9.0

  # UI
  cached_network_image: ^3.4.1
  flutter_svg: ^2.0.10+1

  # Media
  image_picker: ^1.1.2
  url_launcher: ^6.3.1

  # OAuth
  sign_in_with_apple: ^6.1.4
  google_sign_in: ^6.2.2

  # In-App Purchases
  in_app_purchase: ^3.2.0

  # Push notifications (FCM; iOS routed via APNs by Firebase)
  firebase_core: ^3.8.0
  firebase_messaging: ^15.1.5

  # Utilities
  intl: ^0.19.0
  collection: ^1.18.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^5.0.0

  build_runner: ^2.4.13
  freezed: ^2.5.7
  json_serializable: ^6.8.0
  retrofit_generator: ^9.1.5
  drift_dev: ^2.21.0
  riverpod_generator: ^2.6.3

flutter:
  uses-material-design: true
  generate: true
